# Image benchmark: MedMNIST 64px, ImageNet ResNet-18.
# Paper (CXR triage) convention: normal = positive, specificity measured on abnormal images.
name: images
seeds: [100, 101, 102, 103, 104]
specificities: [0.95, 0.98]
datasets:
  pneumoniamnist:
    params: {size: 64, positive: normal}
    target: 0.98
    train: {model: resnet18, augment: true, pretrain_lr: 0.0001, pretrain_epochs: 8,
            finetune_lr: 0.00003, finetune_epochs: 5, batch_size: 64, device: cuda}
  breastmnist:
    params: {size: 64, positive: normal}
    target: 0.95
    train: {model: resnet18, augment: true, pretrain_lr: 0.0001, pretrain_epochs: 20,
            finetune_lr: 0.00003, finetune_epochs: 10, batch_size: 32, device: cuda}
methods:
  bce: [{}]
  weighted_bce: [{pos_weight: 2}, {pos_weight: 4}, {pos_weight: 8}, {pos_weight: 16}]
  focal: [{gamma: 0.5}, {gamma: 1.0}, {gamma: 2.0}, {gamma: 3.0}]
  libauc_pauc: [{Lambda: 0.1, margin: 0.5}, {Lambda: 0.1, margin: 1.0},
                {Lambda: 1.0, margin: 0.5}, {Lambda: 1.0, margin: 1.0}]
  aucreshape_prob: [{boost: 0.05}, {boost: 0.1}, {boost: 0.2}, {boost: 0.4}]
  aucreshape_logit: [{boost: 0.5}, {boost: 1.0}, {boost: 2.0}, {boost: 4.0}]
  aucreshape_weight: [{boost: 0.5}, {boost: 1.0}, {boost: 2.0}, {boost: 4.0}]
